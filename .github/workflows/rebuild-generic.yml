name: Rebuild
permissions: {}
on:
  workflow_call:
    secrets:
      COPR_WEBHOOK:
        required: true
jobs:
  webhook:
    name: Ping copr webhook
    permissions: {}
    steps:
      - name: Use curl to ping webhook
        shell: bash
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: | 
          curl -X POST "$COPR_WEBHOOK" > /dev/null 2>&1